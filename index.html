<!doctype html>
<html lang="uz" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101a3d" />
    <meta name="color-scheme" content="light dark" />
    <title>
      Talaba Studio — referat, kurs ishi, maqola va prezentatsiya muharriri
    </title>
    <meta
      name="description"
      content="Referat, kurs ishi, maqola va prezentatsiyani shablon asosida tuzing, matnni tahrirlang va DOCX, PPTX, PDF sifatida yuklab oling. API kalitisiz, brauzeringizda ishlaydi."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236a4cff'/%3E%3Cpath d='M10 9h12M16 9v14' stroke='white' stroke-width='3' stroke-linecap='round' fill='none'/%3E%3C/svg%3E"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/styles.css" />
    <script>
      /* Mavzuni sahifa chizilishidan oldin qo‘llash (miltillashning oldini oladi) */
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem("ts-theme") || '"system"');
          var dark =
            t === "dark" ||
            (t === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute(
            "data-theme",
            dark ? "dark" : "light",
          );
        } catch (e) {
          /* standart: yorug‘ */
        }
      })();
    </script>
  </head>
  <body>
    <a class="skip" href="#main">Asosiy mazmunga o‘tish</a>

    <div class="app" id="app">
      <aside class="sidebar" aria-label="Asosiy navigatsiya">
        <a class="brand" href="#/bosh"
          ><span class="brand-mark" id="brand-mark"></span>Talaba Studio</a
        >
        <nav class="nav" id="nav-side" aria-label="Bo‘limlar"></nav>
        <div class="side-foot">
          <button class="btn" id="theme-btn-side" type="button"></button>
          <p class="side-note">
            API’siz ishlaydi. Matnlaringiz faqat shu brauzerda saqlanadi.
          </p>
        </div>
      </aside>

      <div class="content-col" style="min-width: 0">
        <header class="topbar">
          <a class="brand" href="#/bosh"
            ><span class="brand-mark" id="brand-mark-m"></span>Talaba Studio</a
          >
          <a
            class="btn icon sm"
            id="settings-m"
            href="#/sozlamalar"
            aria-label="Sozlamalar"
          ></a>
          <button class="btn icon sm" id="theme-btn-top" type="button"></button>
        </header>
        <main class="main" id="main" tabindex="-1"></main>
      </div>

      <nav
        class="bottomnav"
        id="nav-bottom"
        aria-label="Mobil navigatsiya"
      ></nav>
    </div>

    <div id="toasts" aria-live="polite"></div>
    <div id="print-root" aria-hidden="true"></div>

    <noscript
      ><p style="padding: 24px; font-family: sans-serif">
        Talaba Studio ishlashi uchun JavaScript yoqilgan bo‘lishi kerak.
      </p></noscript
    >

    <!-- Kutubxonalar (lokal nusxa). Yuklanmasa ham muharrir ishlayveradi. -->
    <script src="vendor/docx.iife.js"></script>
    <script src="vendor/pptxgen.bundle.js"></script>

    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/model.js"></script>
    <script src="js/export.js"></script>
    <script src="js/editor-doc.js"></script>
    <script src="js/editor-slides.js"></script>
    <script src="js/pages.js"></script>
    <script src="js/app.js"></script>
    <script>
      if (
        "serviceWorker" in navigator &&
        (window.location.protocol === "https:" ||
          window.location.hostname === "localhost" ||
          window.location.hostname === "127.0.0.1")
      ) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
